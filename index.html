<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>umoshi &lt;3</title>

    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/fonts.css">
    <link rel="stylesheet" href="style/style.css">
    <!-- bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div id="app">
        <div class="app-container">
            <div class="header">
                <img src="assets/images/header-pfp.jpeg" alt="Profile Picture">
                <div class="header__info">
                    <p class="header__name">umoshi</p>
                    <p class="header__desc">web developer</p>
                </div>
            </div>
            
            <div class="quick-cards">
                <div class="quick-cards__devices">
                    <p><i class="bi bi-laptop quick-cards__icon"></i> MacBook Air M1 2020</p>
                    <p><i class="bi bi-keyboard quick-cards__icon"></i> AttackShark X66</p>
                    <p><i class="bi bi-mouse quick-cards__icon"></i> Ardor Prime Gaming X</p>
                </div>
                <div class="quick-cards__collabs">
                    <p class="quick-cards__collabs__status">currently open</p>
                    <p class="quick-cards__collabs__sub">for collaborations!</p>
                </div>
                <div class="quick-cards__time">
                    <p class="quick-cards__time__title">my local time <span class="quick-cards__time__timezone">(UTC+3)</span></p>
                    <p class="quick-cards__time__clock">12:00</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="scripts/main.js"></script>
</body>

</html>
